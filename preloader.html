<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spider Preloader – Red Background</title>
<style>
  html,body{height:100%;margin:0;background:#ff0000;overflow:hidden;}
  #preloader{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#ff0000;
    z-index:9999;
  }
  .spider-svg{width:200px;height:200px;}
</style>
</head>
<body>

<div id="preloader">
  <svg class="spider-svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="fillClip">
        <!-- rect will be animated: y from 200 to 0, height from 0 to 200 -->
        <rect id="clipRect" x="0" y="200" width="200" height="0"/>
      </clipPath>
    </defs>

    <!-- Outline (always visible) -->
    <path id="spiderOutline" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      d="
      M100 10
      C130 10 155 30 170 55
      C185 80 190 110 180 135
      C170 160 150 180 125 190
      C100 200 75 190 50 180
      C25 170 5 150 10 125
      C15 100 20 70 35 45
      C50 20 75 10 100 10
      Z
      M100 30
      C115 30 128 40 138 55
      C148 70 152 90 148 110
      C144 130 130 145 115 155
      C100 165 85 155 70 145
      C55 135 42 120 38 100
      C34 80 38 60 48 45
      C58 30 78 30 100 30
      Z
      M100 55
      C110 55 118 62 122 72
      C126 82 128 95 124 106
      C120 117 110 124 100 124
      C90 124 80 117 76 106
      C72 95 74 82 78 72
      C82 62 90 55 100 55
      Z
      M100 80
      C108 80 114 86 116 94
      C118 102 118 112 112 118
      C106 124 96 124 88 118
      C82 112 82 102 84 94
      C86 86 92 80 100 80
      Z
    "/>

    <!-- Fill (black) revealed by clipPath -->
    <path id="spiderFill" fill="#000" clip-path="url(#fillClip)"
      d="
      M100 10
      C130 10 155 30 170 55
      C185 80 190 110 180 135
      C170 160 150 180 125 190
      C100 200 75 190 50 180
      C25 170 5 150 10 125
      C15 100 20 70 35 45
      C50 20 75 10 100 10
      Z
      M100 30
      C115 30 128 40 138 55
      C148 70 152 90 148 110
      C144 130 130 145 115 155
      C100 165 85 155 70 145
      C55 135 42 120 38 100
      C34 80 38 60 48 45
      C58 30 78 30 100 30
      Z
      M100 55
      C110 55 118 62 122 72
      C126 82 128 95 124 106
      C120 117 110 124 100 124
      C90 124 80 117 76 106
      C72 95 74 82 78 72
      C82 62 90 55 100 55
      Z
      M100 80
      C108 80 114 86 116 94
      C118 102 118 112 112 118
      C106 124 96 124 88 118
      C82 112 82 102 84 94
      C86 86 92 80 100 80
      Z
    "/>
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const clipRect = document.getElementById('clipRect');
  const tl = gsap.timeline({
    onComplete:()=> gsap.to('#preloader',{opacity:0,duration:0.6,onComplete:()=>document.getElementById('preloader').remove()})
  });

  // Animate rect from bottom (y=200,height=0) to top (y=0,height=200)
  tl.to(clipRect,{
    duration:2.5,
    ease:'power2.inOut',
    attr:{y:0,height:200}
  });
</script>
</body>
</html>
