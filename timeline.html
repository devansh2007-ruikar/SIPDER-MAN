<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline | Spider-Man: Brand New Day</title>
    <meta name="description" content="Explore the legacy and journey of Peter Parker leading up to Brand New Day.">

    <!-- Cinematic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/timeline-style.css">
</head>

<body>
    <!-- Sleek Audio Controller Button -->
    <button id="audio-toggle-btn" class="audio-toggle-btn" aria-label="Toggle Background Audio" style="z-index: 1000;">
        <span class="sound-wave" aria-hidden="true">
            <span class="bar bar-1"></span>
            <span class="bar bar-2"></span>
            <span class="bar bar-3"></span>
            <span class="bar bar-4"></span>
        </span>
        <span class="audio-btn-text">UNMUTE SOUND</span>
    </button>
    <audio id="bg-audio" src="assets/audio/soundtrack.mp3" loop preload="auto"></audio>

    <!-- The Cinematic Background Canvas -->
    <div class="background-canvas" aria-hidden="true"></div>

    <!-- Glassmorphism Navigation -->
    <header class="glass-nav reveal">
        <nav class="nav-container">
            <div class="logo">MARVEL</div>
            <ul class="nav-links">
                <li><a href="index.html#hero">Home</a></li>
                <li><a href="https://youtu.be/62bIsvRcPv0?si=NhN-lDIJBlBQTSW4" target="_blank"
                        rel="noopener noreferrer">Trailer</a></li>
                <li><a href="cast.html">Cast</a></li>
                <li><a href="timeline.html">Timeline</a></li>
            </ul>

            <!-- Spider-Man Easter Egg -->
            <div id="spidey-drop-container">
                <div class="web-string"></div>
                <img src="assets/images/spidey-hanging.png" id="spidey-hanging" alt="Spider-Man Easter Egg">
            </div>
        </nav>
    </header>

    <main>
        <!-- Intro Section (Allows user to scroll into the pin) -->
        <section class="timeline-intro"
            style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <div class="section-header reveal" style="margin-bottom: 2rem;">
                <h1 class="section-title">The Legacy</h1>
                <div class="title-underline"></div>
                <p style="margin-top: 1.5rem; color: var(--text-muted); font-size: 1.2rem; max-width: 600px;">Scroll
                    down to journey through the cinematic timeline.</p>
            </div>

            <div class="scroll-indicator" style="margin-top: 2rem; animation: bounce 2s infinite;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--spidey-red)" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M19 12l-7 7-7-7" />
                </svg>
            </div>
            <style>
                @keyframes bounce {

                    0%,
                    20%,
                    50%,
                    80%,
                    100% {
                        transform: translateY(0);
                    }

                    40% {
                        transform: translateY(-20px);
                    }

                    60% {
                        transform: translateY(-10px);
                    }
                }
            </style>
        </section>

        <!-- 3D Orbit Timeline Section -->
        <section id="orbit-timeline">
            <!-- Vertical Timeline Tracker -->
            <div class="timeline-tracker-container">
                <div class="tracker-line"></div>
                <img src="assets/images/spider_logo.png" class="spider-indicator" alt="Spider Logo">
                <div class="date-stops">
                    <div class="date-stop active">July-7,2017</div>
                    <div class="date-stop">July-2,2019</div>
                    <div class="date-stop">Dec-17,2021</div>
                    <div class="date-stop">July-31,2026</div>
                </div>
            </div>

            <div class="scene">

                <!-- Center Suit (translateZ: 0 ensures it sits in the exact middle of the 3D space) -->
                <img src="assets/images/suit1.png" class="center-suit" id="main-suit" alt="Spider-Man Suit">

                <!-- Rotating 3D Carousel -->
                <div class="carousel">
                    <div class="poster" style="--r: 0deg;">
                        <img src="assets/images/poster1.jpg" alt="Spider-Man Movie 1">
                    </div>
                    <div class="poster" style="--r: 90deg;">
                        <img src="assets/images/poster2.jpg" alt="Spider-Man Movie 2">
                    </div>
                    <div class="poster" style="--r: 180deg;">
                        <img src="assets/images/poster3.jpg" alt="Spider-Man Movie 3">
                    </div>
                    <div class="poster" style="--r: 270deg;">
                        <img src="assets/images/poster4.jpg" alt="Spider-Man Movie 4">
                    </div>
                </div>

            </div>

            <!-- Dynamic Movie Title Container -->
            <div class="movie-info-container">
                <h2 class="active-movie-title">Spider-Man: Homecoming</h2>
            </div>
        </section>

        <!-- Outro Section (Allows user to scroll out of the pin) -->
        <section class="timeline-outro"
            style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <h2 class="section-title reveal">Brand New Day</h2>
            <div class="title-underline reveal"></div>
            <p class="reveal" style="margin-top: 1.5rem; color: var(--text-muted); font-size: 1.2rem;">Coming this July
                31.</p>
        </section>
    </main>

    <!-- GSAP & ScrollTrigger CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Scripts -->
    <script src="script.js"></script>
    <script src="js/timeline-script.js"></script>
</body>

</html>
